[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-ultimate"
version = "0.1.0"
description = "Offline HOME PDF desktop app for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6==6.9.2",
  "PyMuPDF==1.26.3",
  "pypdf==5.9.0",
  "python-docx==1.2.0"
]

[project.scripts]
pdf-ultimate = "pdf_ultimate.app:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pdf_ultimate*"]

[tool.setuptools.package-data]
pdf_ultimate = ["resources/*.ico", "resources/*.png"]
